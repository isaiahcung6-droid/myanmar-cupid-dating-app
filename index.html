<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Cupid Dating App - Created by Isaiah Cung</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* မူလ Style များ ဒီမှာ ရှိပါမယ် */
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between ...">

    <!-- Navbar အပိုင်း -->
    <nav class="...">
        <!-- ဥပမာ - ဘာသာစကားရွေးရန် Dropdown ထည့်မည့်နေရာ -->
        <select id="lang-select" class="bg-gray-800 text-white px-2 py-1 rounded">
            <option value="my">မြန်မာ</option>
            <option value="en">English</option>
            <option value="tapong">Tapong</option>
        </select>
    </nav>

    <!-- ပင်မ အကြောင်းအရာများ (id လေးတွေ ထည့်ပေးထားပါ) -->
    <main class="p-4">
        <h1 id="hero-title" class="...">သင့်ဖူးစာရှင်ကို ရှာဖွေပါ</h1>
        <p id="hero-desc" class="...">တိုင်းရင်းသား လူမျိုးစုပေါင်းစုံအတွက် လေးစားမှုရှိပြီး လုံခြုံသော Cupid Platform</p>

        <h3 id="rules-title" class="...">အသိုင်းအဝိုင်း စည်းမျဉ်းစည်းကမ်းများ</h3>
        <p id="rules-desc" class="...">ညစ်ညမ်းသော စာ/စကားများ ရေးသားခြင်း၊ ရိုင်းစိုင်းစွာ ပြောဆိုခြင်းနှင့် အနှောင့်အယှက်ပေးခြင်းများကို လုံးဝ ခွင့်မပြုပါ။</p>
    </main>

    <!-- Footer သို့မဟုတ် အောက်ဆုံးအပိုင်း -->
    <footer class="...">
        <p>© 2026 Myanmar Cupid Dating App.</p>
    </footer>

    <!-- ========================================== -->
    <!-- အောက်ဆုံးနားက </body> အပိတ်မတိုင်မီ JavaScript ထည့်ရန် -->
    <!-- ========================================== -->
    <script>
        const translations = {
            my: {
                heroTitle: "သင့်ဖူးစာရှင်ကို ရှာဖွေပါ",
                heroDesc: "တိုင်းရင်းသား လူမျိုးစုပေါင်းစုံအတွက် လေးစားမှုရှိပြီး လုံခြုံသော Cupid Platform",
                rulesTitle: "အသိုင်းအဝိုင်း စည်းမျဉ်းစည်းကမ်းများ",
                rulesDesc: "ညစ်ညမ်းသော စာ/စကားများ ရေးသားခြင်း၊ ရိုင်းစိုင်းစွာ ပြောဆိုခြင်းနှင့် အနှောင့်အယှက်ပေးခြင်းများကို လုံးဝ ခွင့်မပြုပါ။"
            },
            en: {
                heroTitle: "Find Your Match",
                heroDesc: "A respectful and secure Cupid Platform for all ethnic groups",
                rulesTitle: "Community Guidelines",
                rulesDesc: "Inappropriate language, harassment, and abusive behavior are strictly prohibited."
            },
            tapong: {
                heroTitle: "Ngaip-Aam Yong Kuaing",
                heroDesc: "Tapong platform for everyone",
                rulesTitle: "Community Rules",
                rulesDesc: "Strictly respectful environment"
            }
        };

        const langSelect = document.getElementById('lang-select');
        
        langSelect.addEventListener('change', (e) => {
            const selectedLang = e.target.value;
            const data = translations[selectedLang] || translations['my'];

            document.getElementById('hero-title').textContent = data.heroTitle;
            document.getElementById('hero-desc').textContent = data.heroDesc;
            document.getElementById('rules-title').textContent = data.rulesTitle;
            document.getElementById('rules-desc').textContent = data.rulesDesc;
        });
    </script>
</body>
</html>
